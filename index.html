<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>অনলাইন OMR পরীক্ষা</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#1F3864; --ink-2:#2f4f8f; --desk:#e9eef7; --line:#c9d3e6; --soft:#f3f6fc;
  --text:#1b2433; --muted:#5b6678; --ok:#1B6B3A; --ok-bg:#e6f3ea; --bad:#b3261e; --bad-bg:#fbeae8; --warn:#8a5a00; --warn-bg:#fff4cc;
  --red:#c0392b; --red-d:#8f1d27; --pink:#fdecee; --pink-line:#e3a3aa; --pen:#111;
}
*{box-sizing:border-box}
body{margin:0;background:var(--desk);color:var(--text);font-family:"Hind Siliguri","Nirmala UI","Noto Sans Bengali",system-ui,sans-serif;font-size:17px;line-height:1.5;-webkit-text-size-adjust:100%}
button,input{font:inherit;color:inherit}
:focus-visible{outline:3px solid #ffb703;outline-offset:2px}
.wrap{max-width:1000px;margin:0 auto;padding:16px}
.sheet{background:#fff;border:1px solid var(--line);border-radius:4px;padding:22px 26px 28px}

.banner{background:var(--ink);color:#fff;text-align:center;padding:14px 18px;border-radius:3px}
.banner h1{margin:0;font-size:1.5rem;font-weight:700;line-height:1.25}
.banner p{margin:4px 0 0;color:#d6e0f5;font-size:.95rem}

.start{max-width:560px;margin:28px auto}
.start label{display:block;font-weight:600;margin:16px 0 6px;color:var(--ink)}
.start input[type=text]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:4px;background:#fff;font-size:1.05rem}
.start input[type=text]:focus{border-color:var(--ink)}
.facts{display:flex;gap:10px;flex-wrap:wrap;margin:18px 0 4px}
.facts span{background:var(--soft);border:1px solid var(--line);border-radius:4px;padding:5px 12px;font-size:.95rem}
.rules{margin:18px 0 0;padding:10px 14px;background:var(--warn-bg);border-left:4px solid #e0a800;font-size:.97rem}
.rules ul{margin:6px 0 0;padding-left:20px}
.btn{display:inline-block;border:0;border-radius:4px;background:var(--ink);color:#fff;font-weight:600;padding:12px 26px;cursor:pointer;font-size:1.05rem;text-decoration:none}
.btn:hover{background:var(--ink-2)}
.btn[disabled]{opacity:.55;cursor:not-allowed}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--ink)}
.btn.small{padding:7px 16px;font-size:.95rem}
.msg{margin:14px 0 0;padding:10px 14px;border-radius:4px;font-size:.98rem}
.msg.err{background:var(--bad-bg);color:var(--bad);border-left:4px solid var(--bad)}
.msg.info{background:var(--soft);border-left:4px solid var(--ink)}
.examlist{display:grid;gap:12px;margin-top:20px}
.examlist a{display:block;text-decoration:none;color:inherit;border:1.5px solid var(--line);border-radius:4px;padding:14px 16px;background:#fff}
.examlist a:hover{border-color:var(--ink);background:var(--soft)}
.examlist b{display:block;color:var(--ink);font-size:1.1rem}
.examlist small{color:var(--muted);display:block}

/* ---------- sticky exam bar ---------- */
.bar{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff}
.bar-in{max-width:1000px;margin:0 auto;padding:8px 16px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.bar .who{flex:1 1 200px;min-width:0}
.bar .who b{display:block;font-size:1rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .who small{color:#cfdbf3}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.5rem;background:rgba(255,255,255,.12);padding:2px 14px;border-radius:4px;min-width:104px;text-align:center}
.timer.low{background:var(--bad);animation:pulse 1s steps(2) infinite}
@keyframes pulse{50%{opacity:.75}}
@media (prefers-reduced-motion:reduce){.timer.low{animation:none}}
.count{font-size:.98rem;white-space:nowrap}
.bar .btn{background:#fff;color:var(--ink)}
.bar .btn:hover{background:var(--soft)}

/* ---------- OMR sheet ---------- */
.omr{border:2px solid var(--pink-line);border-radius:4px;padding:14px;background:#fff}
.omr-head{background:var(--pink);border:1.5px solid var(--pink-line);color:var(--red-d);text-align:center;padding:10px 14px;border-radius:3px}
.omr-head h1{margin:0;font-size:1.35rem;font-weight:700;line-height:1.3}
.omr-head p{margin:3px 0 0;font-size:.98rem;font-weight:500}
.omr-name{margin:12px 0 0;padding:6px 10px;border-bottom:1.5px solid var(--pink-line);color:var(--red-d);display:flex;gap:8px;align-items:baseline}
.omr-name b{color:var(--text)}
.omr-top{display:flex;gap:16px;flex-wrap:wrap;margin-top:14px;align-items:flex-start}
.roll{border:1.5px solid var(--pink-line);border-radius:3px;padding:8px 10px;background:#fff}
.roll h2,.instr h2{margin:0 0 6px;font-size:.82rem;letter-spacing:.06em;text-align:center;color:var(--red-d);font-weight:700;text-transform:uppercase}
.roll .opt{display:block;text-align:center;font-size:.72rem;color:var(--muted);margin:0 0 4px}
.rcols{display:flex;gap:6px}
.rcol{display:flex;flex-direction:column;align-items:center;gap:3px}
.rbox{width:26px;height:28px;border:1.5px solid var(--pink-line);border-radius:2px;display:grid;place-items:center;font-weight:700;font-size:.95rem;margin-bottom:3px}
.instr{flex:1 1 280px;border:1.5px solid var(--pink-line);border-radius:3px;padding:8px 12px;background:#fff;font-size:.9rem}
.instr ol{margin:0;padding-left:18px}
.instr li{margin:1px 0}

.b{flex:none;width:30px;height:30px;border-radius:50%;border:2px solid var(--red);background:#fff;color:var(--red);font-weight:600;font-size:.92rem;line-height:1;display:inline-grid;place-items:center;padding:0;cursor:pointer;-webkit-tap-highlight-color:transparent}
.b.sm{width:21px;height:21px;font-size:.7rem;border-width:1.5px}
span.b{cursor:default}
button.b:hover{background:var(--pink)}
.b[aria-pressed="true"]{background:var(--pen);border-color:var(--pen);color:#fff}

.omr-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));margin-top:16px;border-top:1.5px solid var(--pink-line)}
.blk{padding:10px 8px 4px}
.blk + .blk{border-left:1.5px solid var(--pink-line);padding-left:18px}
.row{display:flex;align-items:center;gap:10px;padding:3px 4px;border-radius:4px}
.row .no{width:28px;text-align:right;color:var(--red-d);font-weight:600;font-size:.95rem}
.row .tag{font-size:.82rem;font-weight:600;white-space:nowrap;margin-left:4px}

/* review mode */
.row.r{background:var(--ok-bg)} .row.w{background:var(--bad-bg)} .row.s{background:#f5f5f5}
.row .tag.ok{color:var(--ok)} .row .tag.no{color:var(--bad)} .row .tag.sk{color:var(--muted)}
.b.okpick{background:var(--ok);border-color:var(--ok);color:#fff}
.b.okring{border-color:var(--ok);color:var(--ok);box-shadow:0 0 0 3px #bfe2ca}
.b.badpick{background:var(--bad);border-color:var(--bad);color:#fff}
.b.rpick{background:var(--pen);border-color:var(--pen);color:#fff}

/* ---------- result ---------- */
.score{display:flex;align-items:center;gap:22px;flex-wrap:wrap;margin:6px 0 14px}
.big{font-size:3.4rem;font-weight:700;color:var(--ink);line-height:1}
.big small{font-size:1.5rem;color:var(--muted);font-weight:500}
.legend{font-size:.92rem;color:var(--muted);margin:0 0 12px}
.legend i{font-style:normal;display:inline-block;width:12px;height:12px;border-radius:50%;margin:0 4px -1px 10px}
.actions{margin-top:22px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center}

@media (max-width:700px){
  .sheet{padding:14px 10px 20px}
  .omr{padding:10px}
  .blk + .blk{border-left:0;padding-left:8px;border-top:1.5px solid var(--pink-line);margin-top:6px}
  .banner h1{font-size:1.25rem}
  .timer{font-size:1.25rem;min-width:88px}
}
</style>
</head>
<body>
<div id="app"></div>

<script>
/* =====================  সেটিংস (শুধু এই লাইনটা বদলাতে হবে)  ===================== */
const SCRIPT_URL = "PASTE_YOUR_WEB_APP_URL_HERE";   // Apps Script → Deploy → Web app URL
/* ============================================================================ */

const ROLL_COLS = 6;     // রোল নম্বরের ঘর
const BLOCK = 15;        // OMR-এ এক কলামে কয়টি প্রশ্ন
const bn = n => String(n).replace(/\d/g, d => '০১২৩৪৫৬৭৮৯'[d]);
const app = document.getElementById('app');
const examId = new URLSearchParams(location.search).get('exam');
const configured = SCRIPT_URL && !SCRIPT_URL.startsWith('PASTE_');
let exam = null;

function h(tag, attrs, ...kids){
  const el = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (v === null || v === undefined || v === false) continue;
    if (k === 'class') el.className = v;
    else if (k.startsWith('on')) el.addEventListener(k.slice(2), v);
    else el.setAttribute(k, v === true ? '' : v);
  }
  for (const c of kids.flat()){ if (c === null || c === undefined || c === false) continue; el.append(c.nodeType ? c : document.createTextNode(c)); }
  return el;
}
const store = {
  get(k){ try{ return JSON.parse(localStorage.getItem(k)); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
  del(k){ try{ localStorage.removeItem(k); }catch(e){} }
};
function show(...nodes){ app.replaceChildren(...nodes); window.scrollTo(0,0); }
const banner = (e) => h('div',{class:'banner'}, h('h1',{}, e.title), e.sub ? h('p',{}, e.sub) : null);
const page = (...kids) => h('div',{class:'wrap'}, h('div',{class:'sheet'}, ...kids));

async function api(params){
  const r = await fetch(SCRIPT_URL + '?' + new URLSearchParams(params));
  const d = await r.json();
  if (!d.ok) throw new Error(d.error || 'কিছু একটা ভুল হয়েছে');
  return d;
}
function loading(text){
  show(page(h('div',{class:'banner'}, h('h1',{},'অনলাইন OMR পরীক্ষা')), h('div',{class:'start'}, h('div',{class:'msg info',role:'status'}, text || 'লোড হচ্ছে…'))));
}
function failure(msg){
  show(page(h('div',{class:'banner'}, h('h1',{},'অনলাইন OMR পরীক্ষা')),
    h('div',{class:'start'}, h('div',{class:'msg err',role:'alert'}, msg),
      h('p',{style:'margin-top:16px'}, h('a',{href:location.pathname},'পরীক্ষার তালিকায় ফিরে যাও')))));
}
const factsOf = e => [h('span',{},'প্রশ্ন: '+bn(e.count)+'টি'), h('span',{}, e.minutes ? 'সময়: '+bn(e.minutes)+' মিনিট' : 'সময়সীমা নেই'), h('span',{},'প্রতিটি প্রশ্ন ১ নম্বর')];

/* =====================  শুরুর পাতা  ===================== */
async function renderHome(){
  loading();
  try{
    const d = await api({action:'list'});
    const list = d.exams.map(e => h('a',{href:'?exam='+encodeURIComponent(e.id)}, h('b',{}, e.title), e.sub ? h('small',{}, e.sub) : null, h('small',{}, bn(e.count)+'টি প্রশ্ন' + (e.minutes ? ' • ' + bn(e.minutes) + ' মিনিট' : ''))));
    show(page(h('div',{class:'banner'}, h('h1',{},'অনলাইন OMR পরীক্ষা'), h('p',{}, d.exams.length ? 'পরীক্ষা বেছে নাও' : '')),
      h('div',{class:'start'}, d.exams.length ? h('div',{class:'examlist'}, list) : h('div',{class:'msg info'},'এখন কোনো পরীক্ষা চালু নেই।'))));
  }catch(e){ failure('পরীক্ষার তালিকা আনা যায়নি: ' + e.message + ' (ইন্টারনেট দেখে আবার চেষ্টা করো)'); }
}

function savedState(){
  const st = store.get('omr:state:' + examId);
  if (!st || !st.exam || st.exam.id !== examId || !Array.isArray(st.answers)) return null;
  if (st.exam.minutes > 0 && (Date.now() - st.start) / 1000 > st.exam.minutes * 60 + 60){ store.del('omr:state:' + examId); return null; }  // আগের অসমাপ্ত পরীক্ষার সময় শেষ
  return st;
}

function renderStart(){
  const key = 'omr:state:' + examId;
  const nameIn = h('input',{type:'text',id:'name',autocomplete:'name',maxlength:60,placeholder:'পুরো নাম'});
  const err = h('div',{role:'alert'});
  const go = h('button',{class:'btn',type:'button',onclick:begin}, 'OMR শিট খোলো');
  const last = store.get('omr:last') || {};
  nameIn.value = last.name || '';
  const saved = savedState();

  function begin(){
    const name = nameIn.value.trim();
    err.replaceChildren();
    if (!name){ err.append(h('div',{class:'msg err'},'নাম লিখতে হবে।')); return; }
    store.set('omr:last',{name});
    let st = savedState();
    if (st){ st.name = name; }
    else { st = { name, start: Date.now(), answers: Array(exam.count).fill(null), roll: Array(ROLL_COLS).fill(null), exam }; }
    store.set(key, st);
    renderExam(st, key);
  }
  nameIn.addEventListener('keydown', e => { if (e.key === 'Enter') begin(); });

  show(page(banner(exam),
    h('div',{class:'start'},
      h('div',{class:'facts'}, factsOf(exam)),
      saved ? h('div',{class:'msg info',role:'status'}, 'তোমার একটি অসমাপ্ত পরীক্ষা আছে — নাম দিয়ে চালিয়ে যাও। ', h('button',{class:'btn ghost small',type:'button',style:'margin-left:6px',onclick:() => { store.del(key); renderStart(); }},'নতুন করে শুরু')) : null,
      h('label',{for:'name'},'নাম'), nameIn,
      h('div',{class:'rules'}, h('b',{},'শুরুর আগে'),
        h('ul',{}, h('li',{},'প্রশ্নপত্র আলাদা (ছাপানো) থাকবে। এখানে শুধু OMR শিটে উত্তর ভরাট করবে।'),
                   exam.minutes ? h('li',{},'শুরু করলে টাইমার চলতে থাকবে; পেজ রিফ্রেশ করলেও সময় থামবে না।') : null,
                   h('li',{},'জমা দিলে সাথে সাথে নম্বর ও কোনটি ঠিক-ভুল দেখতে পাবে।'))),
      err,
      h('div',{style:'margin-top:20px'}, go),
      h('p',{style:'margin-top:18px'}, h('a',{href:location.pathname,style:'color:var(--muted)'},'অন্য পরীক্ষা বেছে নাও')))));
  nameIn.focus();
}

/* =====================  OMR শিট আঁকা (পরীক্ষা ও রিভিউ দুই মোডেই)  ===================== */
function buildOmr(ex, st, opt){
  const review = opt.mode === 'review';
  const L = ex.labels;
  const abtn = [], rbtn = [], rbox = [];

  const ansBubble = (i,j) => {
    const a = st.answers[i];
    if (review){
      const k = opt.key[i];
      let cls = 'b';
      if (j === k) cls += (a === j) ? ' okpick' : ' okring';
      else if (j === a) cls += ' badpick';
      return h('span',{class:cls}, L[j]);
    }
    const b = h('button',{type:'button',class:'b','aria-pressed': a === j ? 'true' : 'false','aria-label':'প্রশ্ন '+bn(i+1)+', '+L[j], onclick:() => opt.onPick(i,j)}, L[j]);
    (abtn[i] = abtn[i] || [])[j] = b;
    return b;
  };

  const row = i => {
    let tag = null, cls = 'row';
    if (review){
      const a = st.answers[i], k = opt.key[i];
      if (a === k){ cls += ' r'; tag = h('span',{class:'tag ok'},'✓'); }
      else if (a === null || a === undefined){ cls += ' s'; tag = h('span',{class:'tag sk'},'– সঠিক: ' + L[k]); }
      else { cls += ' w'; tag = h('span',{class:'tag no'},'✗ সঠিক: ' + L[k]); }
    }
    return h('div',{class:cls,role:'group','aria-label':'প্রশ্ন '+bn(i+1)},
      h('span',{class:'no'}, bn(i+1)), [0,1,2,3].map(j => ansBubble(i,j)), tag);
  };

  const blocks = [];
  for (let s = 0; s < ex.count; s += BLOCK){
    const rows = [];
    for (let i = s; i < Math.min(ex.count, s + BLOCK); i++) rows.push(row(i));
    blocks.push(h('div',{class:'blk'}, rows));
  }

  const cols = [];
  for (let c = 0; c < ROLL_COLS; c++){
    const box = h('div',{class:'rbox'}, st.roll[c] === null ? '' : bn(st.roll[c]));
    rbox[c] = box;
    const bubs = [];
    for (let d = 0; d <= 9; d++){
      const on = st.roll[c] === d;
      if (review) bubs.push(h('span',{class:'b sm' + (on ? ' rpick' : '')}, bn(d)));
      else {
        const b = h('button',{type:'button',class:'b sm','aria-pressed': on ? 'true' : 'false','aria-label':'রোল ঘর '+bn(c+1)+', অঙ্ক '+bn(d), onclick:() => opt.onRoll(c,d)}, bn(d));
        (rbtn[c] = rbtn[c] || [])[d] = b;
        bubs.push(b);
      }
    }
    cols.push(h('div',{class:'rcol'}, box, bubs));
  }

  const sync = () => {
    abtn.forEach((r,i) => r.forEach((b,j) => b.setAttribute('aria-pressed', st.answers[i] === j ? 'true' : 'false')));
    rbtn.forEach((r,c) => { r.forEach((b,d) => b.setAttribute('aria-pressed', st.roll[c] === d ? 'true' : 'false')); rbox[c].textContent = st.roll[c] === null ? '' : bn(st.roll[c]); });
  };

  const instr = h('div',{class:'instr'}, h('h2',{},'নির্দেশনা'),
    h('ol',{},
      review ? [h('li',{},'সবুজ রঙ = সঠিক উত্তর, লাল = তোমার ভুল উত্তর।'), h('li',{},'ধূসর সারি = উত্তর দাওনি।')] : [
      h('li',{},'বৃত্তে চাপ দিলে সেটি কালো হয়ে ভরাট হবে।'),
      h('li',{},'ভুল হলে ভরাট করা বৃত্তে আবার চাপ দিলে মুছে যাবে।'),
      h('li',{},'প্রতিটি প্রশ্নে একটিমাত্র বৃত্ত ভরাট করো।'),
      h('li',{},'প্রশ্নপত্রের প্রশ্ন নম্বরের সাথে মিলিয়ে উত্তর দাও।'),
      h('li',{},'রোল নম্বর ঐচ্ছিক। দিলে প্রতিটি ঘরের নিচে অঙ্কের বৃত্ত ভরাট করো।')]));

  const el = h('div',{class:'omr'},
    h('div',{class:'omr-head'}, h('h1',{}, ex.title), ex.sub ? h('p',{}, ex.sub) : null),
    h('div',{class:'omr-name'}, h('span',{},'নাম:'), h('b',{}, st.name)),
    h('div',{class:'omr-top'},
      h('div',{class:'roll'}, h('h2',{},'Roll number'), h('span',{class:'opt'},'(ঐচ্ছিক)'), h('div',{class:'rcols'}, cols)), instr),
    h('div',{class:'omr-grid'}, blocks));
  return { el, sync };
}

/* =====================  পরীক্ষা (OMR ভরাট)  ===================== */
function renderExam(st, key){
  exam = st.exam;
  const total = exam.count, limit = exam.minutes * 60;
  const cnt = h('span',{class:'count'});
  const timer = limit > 0 ? h('div',{class:'timer',role:'timer','aria-live':'off'},'--:--') : null;
  const err = h('div',{role:'alert'});
  const sub = h('button',{class:'btn small',type:'button',onclick:() => finish(false)},'জমা দাও');
  let busy = false, tick = null;

  const omr = buildOmr(exam, st, {
    mode:'exam',
    onPick:(i,j) => { st.answers[i] = (st.answers[i] === j) ? null : j; store.set(key, st); omr.sync(); refresh(); },
    onRoll:(c,d) => { st.roll[c] = (st.roll[c] === d) ? null : d; store.set(key, st); omr.sync(); }
  });
  function refresh(){ cnt.textContent = 'উত্তর ' + bn(st.answers.filter(x => x !== null).length) + '/' + bn(total); }

  show(
    h('div',{class:'bar'}, h('div',{class:'bar-in'},
      h('div',{class:'who'}, h('b',{}, exam.title), h('small',{}, st.name)), cnt, timer, sub)),
    h('div',{class:'wrap'}, h('div',{class:'sheet'}, err, omr.el,
      h('div',{style:'margin-top:22px;text-align:center'}, h('button',{class:'btn',type:'button',onclick:() => finish(false)},'OMR জমা দাও')))));
  window.scrollTo(0,0);
  refresh();

  function remaining(){ return Math.max(0, Math.round(limit - (Date.now() - st.start)/1000)); }
  function paint(){
    const r = remaining();
    timer.textContent = bn(String(Math.floor(r/60)).padStart(2,'0')) + ':' + bn(String(r%60).padStart(2,'0'));
    timer.classList.toggle('low', r <= 300);
    if (r <= 0){ clearInterval(tick); finish(true); }
  }
  if (limit > 0){ tick = setInterval(paint, 1000); paint(); }
  window.onbeforeunload = () => true;

  async function finish(auto){
    if (busy) return;
    if (!auto){
      const left = st.answers.filter(x => x === null).length;
      const ok = confirm(left ? bn(left)+' টি প্রশ্নের উত্তর ভরাট করোনি। তবুও জমা দেবে?' : 'OMR জমা দেবে? জমা দিলে আর বদলানো যাবে না।');
      if (!ok) return;
    }
    busy = true; clearInterval(tick); sub.disabled = true; err.replaceChildren(h('div',{class:'msg info',role:'status'}, auto ? 'সময় শেষ — OMR জমা হচ্ছে…' : 'জমা হচ্ছে…'));
    const el = Math.round((Date.now() - st.start)/1000);
    const payload = { exam: exam.id, name: st.name, roll: st.roll.filter(x => x !== null).join(''),
                      answers: st.answers.map(x => x === null ? -1 : x), seconds: limit > 0 ? Math.min(limit, el) : el };
    try{
      const res = await fetch(SCRIPT_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
      const data = await res.json();
      if (!data.ok) throw new Error(data.error || 'জমা হয়নি');
      const done = { name: st.name, roll: st.roll, score: data.score, total: data.total, key: data.key, answers: st.answers, seconds: payload.seconds, exam: st.exam };
      store.del(key);
      window.onbeforeunload = null;
      renderResult(done);
    }catch(e){
      busy = false; sub.disabled = false; if (limit > 0 && remaining() > 0) tick = setInterval(paint, 1000);
      const again = h('button',{class:'btn small',type:'button',style:'margin-left:10px',onclick:() => finish(true)},'আবার চেষ্টা করো');
      err.replaceChildren(h('div',{class:'msg err'}, 'জমা হয়নি: ' + (e.message || 'ইন্টারনেট সংযোগ দেখো') + '। তোমার উত্তর এই ডিভাইসে সেভ আছে, পেজ বন্ধ কোরো না। ', again));
    }
  }
}

/* =====================  ফলাফল ও রিভিউ  ===================== */
function renderResult(r){
  exam = r.exam;
  const total = r.total, pct = Math.round(r.score/total*100);
  const mm = Math.floor(r.seconds/60), ss = r.seconds % 60;
  const omr = buildOmr(exam, { name: r.name, answers: r.answers, roll: r.roll }, { mode:'review', key: r.key });
  show(page(banner(exam),
    h('div',{class:'start',style:'margin:18px auto 0;max-width:none'},
      h('div',{class:'score'},
        h('div',{class:'big'}, bn(r.score), h('small',{},' / '+bn(total))),
        h('div',{}, h('b',{style:'font-size:1.2rem'}, r.name), h('div',{class:'legend',style:'margin:0'}, 'শতকরা ' + bn(pct) + '% • সময় লেগেছে ' + bn(mm) + ' মিনিট ' + bn(ss) + ' সেকেন্ড'),
          h('div',{class:'legend',style:'margin:0'}, 'তোমার ফলাফল শিক্ষকের কাছে জমা হয়েছে।'))),
      h('p',{class:'legend'},
        h('i',{style:'background:var(--ok)'}), 'সঠিক', h('i',{style:'background:var(--bad)'}), 'ভুল', h('i',{style:'background:#fff;border:2px solid var(--ok)'}), 'এটাই ছিল সঠিক উত্তর')),
    omr.el,
    h('div',{class:'actions'}, h('a',{class:'btn',href:'?exam='+encodeURIComponent(exam.id)},'আবার পরীক্ষা দাও'), h('a',{class:'btn ghost',href:location.pathname},'অন্য পরীক্ষা'))));
}

/* =====================  শুরু  ===================== */
(async function main(){
  if (!configured){ failure('সেটআপ বাকি আছে: index.html-এর SCRIPT_URL-এ Apps Script-এর Web app URL বসাতে হবে।'); return; }
  if (!examId){ renderHome(); return; }
  loading();
  try{
    const d = await api({action:'exam', id: examId});
    exam = d.exam;
    renderStart();
  }catch(e){ failure(e.message); }
})();
</script>
